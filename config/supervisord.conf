[supervisord]
nodaemon=true
user=root
logfile=/var/log/wukong/supervisord.log
pidfile=/run/supervisord.pid

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork
priority=10
autorestart=true

[program:vnc]
command=/usr/bin/Xtigervnc :1 -geometry 1440x900 -depth 24 -rfbport 5901 -localhost no -SecurityTypes VncAuth -PasswordFile /root/.vnc/passwd -AlwaysShared
priority=20
autorestart=true

[program:wukong]
command=/usr/lib/tsinclient/resources/extraResource/linux/tsinvc-linux run /usr/lib/tsinclient/resources/extraResource/linux/linuxClient.json
directory=/usr/lib/tsinclient/resources/extraResource/linux
priority=30
autorestart=true
stdout_logfile=/var/log/wukong/daemon.log
stderr_logfile=/var/log/wukong/daemon-error.log

[program:desktop]
command=/usr/local/bin/desktop.sh
priority=40
autorestart=true
stopasgroup=true
killasgroup=true

[program:socks]
command=/usr/bin/microsocks -i 0.0.0.0 -p 1080
priority=50
autorestart=true

[program:http]
command=/usr/bin/tinyproxy -d -c /etc/wukong/tinyproxy.conf
priority=50
autorestart=true
