name: docker-wukong
services:
  wukong:
    build: .
    image: wukong:2.14.00051.1-arm64
    platform: linux/arm64
    container_name: wukong
    hostname: wukong-arp
    mac_address: '02:42:77:6b:00:01'
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - '${WUKONG_BIND_IP:-127.0.0.1}:5902:5901'
      - '${WUKONG_BIND_IP:-127.0.0.1}:1081:1080'
      - '${WUKONG_BIND_IP:-127.0.0.1}:8889:8888'
    shm_size: 1gb
    volumes:
      - identity:/var/lib/wukong
      - home:/root
      - client:/usr/lib/tsinclient/resources/extraResource/linux
      - logs:/var/log/wukong
    secrets:
      - vnc_password
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
secrets:
  vnc_password:
    file: .secrets/vnc_password
volumes:
  identity:
  home:
  client:
  logs:
